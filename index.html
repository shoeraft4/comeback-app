<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Comeback: die Community für Verletzte auf dem Weg zurück in den Sport.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M26 9.5A12 12 0 1 0 26 22.5' fill='none' stroke='%23F2621F' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Comeback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-sized app column; sporty italic condensed numerals, bright orange energy, floating pill nav. */
:root {
  --bg: #F5F3F1;
  --surface: #FFFFFF;
  --surface-2: #F1EEEB;
  --line: #E7E2DD;
  --fg: #17130F;
  --muted: #776D66;
  --accent: #F2621F;
  --accent-2: #D9461A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FFE9DE;
  --sun: #FFC23D;
  --sun-soft: #FFF3D6;
  --go: #1C9E68;
  --go-soft: #DDF4E9;
  --sky: #3F7BE0;
  --sky-soft: #E2ECFB;
  --plum: #8B4FD8;
  --plum-soft: #EFE5FB;
  --night: #17130F;
  --night-fg: #FFF8F3;
  --stage: #E4DFDA;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141110; --surface: #1F1B19; --surface-2: #2A2522; --line: #352F2B; --fg: #F6F1EC; --muted: #A79C94;
  --accent: #FF7234; --accent-2: #E8521E; --accent-ink: #FFFFFF; --accent-soft: #3A2116;
  --sun: #FFC94F; --sun-soft: #3A3018; --go: #4CC991; --go-soft: #17322A; --sky: #7DA6F0; --sky-soft: #1B2840;
  --plum: #B48AF0; --plum-soft: #2C2140; --night: #0B0908; --night-fg: #FFF8F3; --stage: #0B0908; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141110; --surface: #1F1B19; --surface-2: #2A2522; --line: #352F2B; --fg: #F6F1EC; --muted: #A79C94;
  --accent: #FF7234; --accent-2: #E8521E; --accent-ink: #FFFFFF; --accent-soft: #3A2116;
  --sun: #FFC94F; --sun-soft: #3A3018; --go: #4CC991; --go-soft: #17322A; --sky: #7DA6F0; --sky-soft: #1B2840;
  --plum: #B48AF0; --plum-soft: #2C2140; --night: #0B0908; --night-fg: #FFF8F3; --stage: #0B0908; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--stage); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.42;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; box-sizing: border-box; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }

.stage { height: 100%; display: flex; justify-content: center; align-items: center; }
.phone { width: 100%; max-width: 400px; height: 100%; max-height: 840px; background: var(--bg); border-radius: 36px; overflow: hidden;
  display: flex; flex-direction: column; box-shadow: 0 0 0 10px var(--fg), 0 30px 60px rgba(0,0,0,.25); position: relative; }
@media (max-width: 480px) { body { background: var(--bg); padding-block: 0; } .phone { border-radius: 0; box-shadow: none; max-height: none; } }

.disp { font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase; letter-spacing: .005em; line-height: .9; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }

/* Top bar */
.top { padding: 16px 18px 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; }
.hello { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hello b { display: block; font-size: 17px; line-height: 1.1; }
.hello span { font-size: 12.5px; color: var(--muted); }
.streak { display: inline-flex; align-items: center; gap: 4px; background: var(--sun-soft); color: var(--fg); font-weight: 800; font-family: var(--display); font-style: italic; font-size: 18px; padding: 4px 10px 4px 8px; border-radius: 999px; }
.streak svg { width: 18px; height: 18px; color: var(--accent); }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; position: relative; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.dot { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }

.scroll { flex: 1; overflow-y: auto; padding: 6px 16px 112px; display: flex; flex-direction: column; gap: 14px; }
.scroll > *, .ob > * { flex-shrink: 0; }
.card { background: var(--surface); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* Avatars */
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13.5px; flex: none; color: #fff; position: relative; }
.av.sm { width: 30px; height: 30px; font-size: 11px; }
.av.lg { width: 60px; height: 60px; font-size: 20px; }
.c1 { background: var(--accent); } .c2 { background: var(--sky); } .c3 { background: var(--go); } .c4 { background: var(--plum); } .c5 { background: #C2843A; }
.online::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--go); border: 2px solid var(--surface); }
.stack { display: flex; }
.stack .av { border: 2.5px solid var(--surface); }
.stack .av + .av { margin-left: -10px; }

/* Hero */
.hero { background: linear-gradient(140deg, var(--accent) 0%, var(--accent-2) 100%); color: var(--accent-ink); border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; right: -60px; top: -70px; width: 220px; height: 220px; border-radius: 50%; border: 26px solid rgba(255,255,255,.12); }
.hero .eyebrow { color: rgba(255,255,255,.8); }
.hero .big { font-size: 76px; }
.hero .big small { font-size: 30px; margin-right: 4px; }
.hero .sub { font-size: 14px; font-weight: 600; opacity: .92; }
.ring { width: 96px; height: 96px; position: relative; flex: none; }
.ring svg { width: 96px; height: 96px; transform: rotate(-90deg); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .lbl b { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 26px; line-height: 1; display: block; }
.ring .lbl span { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .85; display: block; }
.segs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; position: relative; }
.seg { display: flex; flex-direction: column; gap: 6px; font-size: 11px; font-weight: 600; opacity: .7; }
.seg i { height: 6px; border-radius: 3px; background: rgba(255,255,255,.28); overflow: hidden; display: block; }
.seg i b { display: block; height: 100%; background: #fff; border-radius: 3px; }
.seg.cur { opacity: 1; }
.seg.done i { background: #fff; }

/* Crew strip */
.crew { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; }
.crew p { font-size: 13.5px; line-height: 1.25; }
.crew p b { display: block; font-size: 14.5px; }
.pill-btn { background: var(--fg); color: var(--bg); font-weight: 700; font-size: 13px; padding: 9px 14px; border-radius: 999px; white-space: nowrap; }

/* Check-in */
.mood { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.mood button { aspect-ratio: 1; border-radius: 16px; background: var(--surface-2); font-family: var(--display); font-style: italic; font-weight: 800; font-size: 24px; transition: transform .15s; }
.mood button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); transform: scale(1.06); }
.btn { border-radius: 16px; padding: 14px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); width: 100%; font-size: 15px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.dark { background: var(--fg); color: var(--bg); }
.done-note { display: flex; gap: 12px; align-items: center; background: var(--go-soft); border-radius: 16px; padding: 12px 14px; }
.done-note svg { width: 28px; height: 28px; color: var(--go); flex: none; }

/* Next milestone */
.track { display: flex; align-items: center; gap: 0; margin: 4px 2px 0; }
.track .n { width: 14px; height: 14px; border-radius: 50%; background: var(--line); flex: none; display: grid; place-items: center; }
.track .n.done { background: var(--accent); }
.track .n.next { width: 22px; height: 22px; background: var(--surface); border: 4px solid var(--accent); }
.track .l { flex: 1; height: 4px; background: var(--line); }
.track .l.done { background: var(--accent); }
.tlabels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.ms-big { font-size: 34px; }

/* Story card */
.story { background: var(--night); color: var(--night-fg); }
.story .eyebrow { color: var(--sun); }
.story .q { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 27px; line-height: 1.02; text-transform: uppercase; }

/* Group */
.g-head h1 { font-size: 40px; }
.g-head .meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.live { display: inline-flex; align-items: center; gap: 5px; color: var(--go); font-weight: 700; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--go); }
.stories { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.st { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; flex: none; width: 62px; }
.st .rg { padding: 3px; border-radius: 50%; background: conic-gradient(var(--sun), var(--accent), var(--accent-2), var(--sun)); }
.st .rg.seen { background: var(--line); }
.st .rg .av { width: 54px; height: 54px; font-size: 17px; border: 3px solid var(--bg); }
.st .add { width: 60px; height: 60px; border-radius: 50%; border: 2px dashed var(--muted); display: grid; place-items: center; color: var(--muted); }
.st .add svg { width: 22px; height: 22px; }
.st .tag { font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-top: -3px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
.chip { border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 13.5px; background: var(--surface); white-space: nowrap; flex: none; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.chip:disabled { opacity: .45; cursor: default; }
.chip .soon { font-size: 10.5px; font-weight: 700; color: var(--muted); margin-left: 4px; }

.compose { display: flex; gap: 8px; align-items: center; background: var(--surface); border-radius: 18px; padding: 8px 8px 8px 10px; }
.compose textarea { flex: 1; min-width: 0; resize: none; border: 0; background: transparent; color: var(--fg); font: inherit; height: 38px; padding: 9px 4px; }
.compose textarea:focus { outline: none; }
.compose .send { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.compose .send svg { width: 18px; height: 18px; }

.post { gap: 10px; }
.post .who { font-weight: 700; }
.post .meta { font-size: 12.5px; color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.b-mentor { background: var(--accent); color: var(--accent-ink); }
.b-week { background: var(--surface-2); color: var(--muted); }
.b-sun { background: var(--sun); color: #17130F; }
.reply { background: var(--accent-soft); border-radius: 16px; padding: 12px; display: flex; gap: 10px; }
.reply p { font-size: 14px; }
.reply .rn { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; flex-wrap: wrap; }
.reacts { display: flex; gap: 6px; flex-wrap: wrap; }
.re { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 700; background: var(--surface-2); }
.re svg { width: 15px; height: 15px; }
.re[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.mile { background: var(--sun-soft); border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 14px; }
.mile .v { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 52px; line-height: .85; color: var(--fg); }
.mile p { font-weight: 700; font-size: 14px; line-height: 1.25; }

/* Stories / videos */
.feat { position: relative; border-radius: 24px; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; color: #fff; text-align: left; width: 100%; }
.feat .bgw { position: absolute; inset: 0; }
.feat .wm { position: absolute; right: 10px; top: -6px; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 110px; line-height: 1; color: rgba(255,255,255,.12); }
.feat > *:not(.bgw):not(.wm):not(.playc) { position: relative; }
.feat h2 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 28px; line-height: .95; text-transform: uppercase; }
.playc { width: 46px; height: 46px; border-radius: 50%; background: #fff; color: var(--accent); display: grid; place-items: center; position: absolute; right: 16px; bottom: 16px; }
.playc svg { width: 18px; height: 18px; margin-left: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.reel { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 9 / 13; max-width: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; color: #fff; text-align: left; }
.reel .bgw { position: absolute; inset: 0; }
.reel > *:not(.bgw) { position: relative; }
.reel .wm { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 54px; line-height: .9; color: rgba(255,255,255,.95); }
.reel h3 { font-size: 14px; line-height: 1.2; font-weight: 700; }
.reel .by { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; margin-top: 6px; }
.dur { background: rgba(0,0,0,.35); font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.g-a { background: linear-gradient(160deg, #FF8A3D, #E23E16); }
.g-b { background: linear-gradient(160deg, #3F7BE0, #2A3F9E); }
.g-c { background: linear-gradient(160deg, #1FB079, #0F6D53); }
.g-d { background: linear-gradient(160deg, #A06BE6, #5B2EA6); }
.g-e { background: linear-gradient(160deg, #FFB23D, #E86A1A); }
.g-f { background: linear-gradient(160deg, #3B3330, #17130F); }
.saved-dot { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,.3); display: grid; place-items: center; }
.saved-dot svg { width: 15px; height: 15px; }

/* Profile */
.path { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.step { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.step .c { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 17px; }
.step.done .c { background: var(--accent); color: var(--accent-ink); }
.step.cur .c { background: var(--fg); color: var(--bg); }
.step.cur { color: var(--fg); }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bdg { border-radius: 16px; padding: 12px 6px; text-align: center; font-size: 11.5px; font-weight: 700; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bdg .n { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 26px; color: var(--accent); line-height: 1; }
.bdg.locked { opacity: .45; }
.toggle { appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .2s; margin: 0; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle:checked { background: var(--accent); }
.toggle:checked::after { transform: translateX(18px); }

/* Bottom nav */
.nav { position: absolute; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--night); border-radius: 26px; display: grid; grid-template-columns: 1fr 1fr 64px 1fr 1fr; align-items: center; padding: 8px 6px; box-shadow: 0 12px 30px rgba(0,0,0,.22); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; color: rgba(255,248,243,.55); padding: 4px 0; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="true"] { color: var(--night-fg); }
.tab[aria-current="true"] svg { color: var(--accent); }
.fab { width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; justify-self: center; margin-top: -26px; box-shadow: 0 8px 20px rgba(242,98,31,.45); border: 4px solid var(--bg); }
.fab svg { width: 24px; height: 24px; }

/* Onboarding */
.ob { flex: 1; overflow-y: auto; padding: 8px 22px 24px; display: flex; flex-direction: column; gap: 18px; }
.ob h1 { font-size: 46px; }
.ob h1 em { font-style: italic; color: var(--accent); }
.ob .foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.dots { display: flex; gap: 6px; }
.dots i { height: 5px; flex: 1; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--accent); }
.range { width: 100%; accent-color: var(--accent); }
.bigval { font-size: 64px; color: var(--accent); font-variant-numeric: tabular-nums; }
.welcome { border-radius: 28px; background: linear-gradient(150deg, var(--accent), var(--accent-2)); color: #fff; padding: 22px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; min-height: 230px; justify-content: flex-end; }
.welcome::before { content: ""; position: absolute; left: -40px; top: -50px; width: 200px; height: 200px; border-radius: 50%; border: 28px solid rgba(255,255,255,.14); border-right-color: transparent; transform: rotate(-30deg); }
.welcome .stack .av { border-color: var(--accent); }
.welcome > * { position: relative; }

.toast { position: absolute; left: 18px; right: 18px; bottom: 100px; background: var(--fg); color: var(--bg); padding: 12px 14px; border-radius: 14px; font-weight: 600; font-size: 14px; z-index: 5; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .25s ease-out; } @keyframes up { from { transform: translateY(8px); opacity: .6; } } .mood button:active { transform: scale(.94); } }
</style>

</head>
<body>
<div class="stage"><div class="phone" id="app"></div></div>

<script>
const sv = (p, f) => `<svg viewBox="0 0 24 24" fill="${f ? 'currentColor' : 'none'}" stroke="${f ? 'none' : 'currentColor'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  home: sv('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'),
  crew: sv('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.3.2 4 1.8 4.5 4.5"/>'),
  play: sv('<path d="M7 4.5l13 7.5-13 7.5z"/>', 1),
  stories: sv('<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M10 9l5 3-5 3z" fill="currentColor"/>'),
  user: sv('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'),
  plus: sv('<path d="M12 5v14M5 12h14"/>'),
  bell: sv('<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>'),

/* Heute */
function heute() {
  const w = S.week, p = phaseOf(w), C = 2 * Math.PI * 40, pct = Math.min(1, w / 38);
  const segs = PHASES.map(ph => {
    const cls = w >= ph.to ? 'done' : (w >= ph.from ? 'cur' : '');
    const fill = cls === 'cur' ? `<b style="width:${Math.max(8, Math.round((w - ph.from) / (ph.to - ph.from) * 100))}%"></b>` : '';
    return `<div class="seg ${cls}"><i>${fill}</i>${ph.name}</div>`;
  }).join('');
  const nextIdx = MILESTONES.findIndex(m => m.w > w), nx = MILESTONES[nextIdx];
  const track = MILESTONES.map((m, i) => `${i ? `<span class="l ${m.w <= w || i === nextIdx ? 'done' : ''}"></span>` : ''}<span class="n ${m.w <= w ? 'done' : ''} ${i === nextIdx ? 'next' : ''}"></span>`).join('');
  return `
  <section class="hero" aria-label="Dein Fortschritt">
    <div class="row between" style="align-items:flex-start;position:relative">
      <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Dein Comeback</span>
        <div class="disp big"><small>W</small>${w}</div>
        <span class="sub">Tag ${w * 7 + 2} · ${esc(S.injury)}</span></div>
      <div class="ring"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="9"/>
        <circle cx="48" cy="48" r="40" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct)).toFixed(1)}"/></svg>
        <div class="lbl"><div><b>${Math.round(pct * 100)}%</b><span>bis zum<br>1. Spiel</span></div></div></div>
    </div>
    <div class="segs">${segs}</div>
  </section>
  <div class="card crew"><div class="row"><div class="stack">${av('LM','c3','sm')}${av('JR','c2','sm')}${av('LB','c1','sm')}${av('MK','c5','sm')}</div>
    <p><b>14 online</b><span class="muted">Lea fragt etwas</span></p></div>
    <button class="pill-btn" data-a="tab" data-v="gruppe">Zur Crew</button></div>
  <div class="card">
    <div class="row between"><span class="eyebrow">Wöchentlicher Check-in</span><span class="badge b-sun">${S.checkedIn ? 'Erledigt' : 'Hält deinen Streak'}</span></div>
    ${S.checkedIn ? `<div class="done-note">${I.checkC}<div><b>Streak: ${S.streak} Wochen am Stück</b><div class="small muted">Dein Check-in ist in der Crew. Lea und Jonas waren auch schon da.</div></div></div>` : `
    <p class="disp" style="font-size:26px">Wie fühlt sich dein Knie an?</p>
    <div class="mood">${[1,2,3,4,5].map(n => `<button aria-pressed="${S.mood === n}" data-a="mood" data-v="${n}" aria-label="Gefühl ${n} von 5">${n}</button>`).join('')}</div>
    <div class="row between small muted"><span>schwierig</span><span>richtig gut</span></div>
    <button class="btn" data-a="checkin" ${S.mood ? '' : 'disabled'}>Check-in teilen</button>`}
  </div>
  <div class="card">
    <div class="row between"><span class="eyebrow">Nächster Meilenstein</span><span class="small muted">noch ${nx.w - w} Wochen</span></div>
    <p class="disp ms-big">${nx.t}</p>
    <div class="track" aria-hidden="true">${track}</div>
    <div class="tlabels"><span>OP</span><span>Woche ${nx.w}</span><span>Erstes Spiel</span></div>

/* Stories */
function videos() {
  const p = phaseOf(S.week);
  const filters = ['Meine Phase', 'Alle', 'Prävention', 'Gespeichert'];
  const feat = VIDEOS.find(v => v.story);
  const list = VIDEOS.filter(v => !v.story).filter(v => {

  const reel = v => `<button class="reel" data-a="toast" data-msg="Video wird abgespielt (Prototyp)" aria-label="${esc(v.title)} abspielen">

    e.preventDefault();

    S.posts.unshift({ id: 'u' + Date.now(), who: 'Sara K.', av: 'SK', c: 'c1', week: S.week, time: 'gerade eben', text: v, r: { stark: 0, kenn: 0, danke: 0 }, mine: null });
    flash('Gepostet. Luca wird benachrichtigt, falls niemand antwortet.');
  });
}

let tt;
function flash(msg) { S.toast = msg; render(true); clearTimeout(tt); tt = setTimeout(() => { S.toast = ''; render(true); }, 2600); }
function render(keep) {
  const sc = document.getElementById('scroll'); const top = sc ? sc.scrollTop : 0;
  S.screen === 'onboard' ? onboarding() : main();
  const n = document.getElementById('scroll'); if (n && keep) n.scrollTop = top;
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, v = b.dataset.v;
  if (a === 'next') { S.step++; render(); }
  else if (a === 'back') { S.step = Math.max(0, S.step - 1); render(); }
  else if (a === 'injury') { S.injury = v; render(); }
  else if (a === 'sport') { S.sport = v; render(); }
  else if (a === 'buddy') { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); b.textContent = on ? 'Verbunden' : 'Verbinden'; }
  else if (a === 'finish') { S.screen = 'app'; S.tab = 'gruppe'; render(); }
  else if (a === 'tab') { S.tab = v; render(); }
  else if (a === 'compose') { S.tab = 'gruppe'; render(); const m = document.getElementById('msg'); if (m) m.focus(); }
  else if (a === 'mood') { S.mood = +v; render(true); }
  else if (a === 'checkin') {
    S.checkedIn = true; S.streak++;
    S.posts.unshift({ id: 'c' + Date.now(), who: 'Sara K.', av: 'SK', c: 'c1', week: S.week, time: 'gerade eben', text: `Check-in Woche ${S.week}: Knie-Gefühl ${S.mood} von 5.`, r: { stark: 0, kenn: 0, danke: 0 }, mine: null });
    flash(`Streak: ${S.streak} Wochen. Stark!`);
  }
  else if (a === 'react') {
    const p = S.posts.find(x => x.id === v), r = b.dataset.r;
    if (p.mine) p.r[p.mine]--;
    p.mine = p.mine === r ? null : r;
    if (p.mine) p.r[p.mine]++;
    render(true);
  }
  else if (a === 'vf') { S.filter = v; render(true); }
  else if (a === 'pub') { S.publicDetails = b.checked; }
  else if (a === 'toast') { flash(b.dataset.msg); }
  else if (a === 'restart') { S.screen = 'onboard'; S.step = 0; S.tab = 'heute'; render(); }
});

render();
</script>
